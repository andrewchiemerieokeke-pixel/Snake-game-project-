<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            border: 1px solid black;
            display: block;
            margin: 0 auto;
        }

        #scoreBoard {
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div id="scoreBoard">Score: 0</div>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let isGameOver = false;

        const resetGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            isGameOver = false;
            drawGame();
        };

        const randomFoodPosition = () => {
            return {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        };

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }

            const scoreElement = document.getElementById("scoreBoard");

            if (isGameOver) {
                scoreElement.textContent = `Score: ${score}`;
                document.getElementById("info").textContent =
                    `Game over! Final score: ${score}. Press Space to restart.`;
                return;
            }

            scoreElement.textContent = `Score: ${score}`;
            document.getElementById("info").textContent =
                `Score: ${score}`;
        };

        drawGame();

        // ===== MOVEMENT =====
        const moveSnake = () => {
            if (isGameOver) return;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            const hitWall =
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount;

            const hitSelf = snake.some(
                (segment, index) =>
                    index !== snake.length - 1 &&
                    segment.x === head.x &&
                    segment.y === head.y
            );

            if (hitWall || hitSelf) {
                isGameOver = true;
                drawGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 1;
                food = randomFoodPosition();
            } else {
                snake.pop();
            }

            drawGame();
        };

        setInterval(moveSnake, 150);

        // ===== KEYBOARD CONTROLS =====
        document.addEventListener("keydown", (event) => {
            if (event.key === " ") {
                if (isGameOver) {
                    resetGame();
                }
                return;
            }

            const newDirection = {
                ArrowUp: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 }
            }[event.key];

            if (!newDirection) return;

            if (isGameOver) return;

            const wouldReverse =
                newDirection.x === -direction.x &&
                newDirection.y === -direction.y;

            if (!wouldReverse) {
                direction = newDirection;
            }
        });

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop) ✅
        // Step 2: Keyboard controls (arrow keys) ✅
        // Step 3: Eating and growing ✅
        // Step 4: Game over ✅
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
